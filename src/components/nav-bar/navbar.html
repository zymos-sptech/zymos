<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-con" href="./assets/logo-icon.png" />
    <link rel="stylesheet" href="./src/css/global.css" />
    <link rel="stylesheet" href="./src/components/nav-bar/style.css" />
    <script
      src="https://kit.fontawesome.com/79924d81b1.js"
      crossorigin="anonymous"
    ></script>

    <title>NavBar</title>
  </head>
  <body>
    <header class="navBar">
      <img
        class="logo"
        src="./assets/zymos-logo-bege.svg"
        alt="zymos"
        draggable="false"
      />
      <nav>
        <ul>
          <li><a href="">Inicio</a></li>
          <li><a href="">Sobre nós</a></li>
          <li><a href="">Serviços</a></li>
          <li><a href="">Planos</a></li>
          <li><a href="">Simulador</a></li>
          <li><a href="">Contato</a></li>
        </ul>
      </nav>
      <button class="btn-menu cursor" onclick="menuOpen()">
        <i
          class="fa-solid fa-bars"
          style="color: var(--color-blue-dark) menu-icon"
        ></i>
      </button>
      <div class="container-login-cadastro">
        <a href="./src/pages/login.html">
          <button class="btn-login cursor">
            <i
              class="fa-solid fa-arrow-right-to-bracket"
              style="color: var(--color-blue-dark)"
            ></i>
            Entrar
          </button>
        </a>
        <a href="./src/pages/cadastro.html">
          <button class="btn-cadastro cursor">Cadastre-se</button>
        </a>
      </div>
    </header>
    <div id="menu-mobile" class="menu-container-mobile">
      <!-- Botão para fechar o menu -->
      <button class="btn-close cursor" onclick="menuClose()">
        <i class="fa-solid fa-xmark" style="color: var(--color-blue-dark)"></i>
      </button>

      <!-- Links replicados para o mobile -->
      <nav>
        <ul>
          <li><a href="">Inicio</a></li>
          <li><a href="">Sobre nós</a></li>
          <li><a href="">Serviços</a></li>
          <li><a href="">Planos</a></li>
          <li><a href="">Simulador</a></li>
          <li><a href="">Contato</a></li>
        </ul>
      </nav>

      <div class="container-login-cadastro-mobile">
        <a href="./src/pages/login.html">
          <button class="btn-login cursor">
            <i
              class="fa-solid fa-arrow-right-to-bracket"
              style="color: var(--color-blue-dark)"
            ></i>
            Entrar
          </button>
        </a>
        <a href="./src/pages/cadastro.html">
          <button class="btn-cadastro cursor">Cadastre-se</button>
        </a>
      </div>
    </div>
  </body>
</html>
