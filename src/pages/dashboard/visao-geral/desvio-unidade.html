<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desvios por Unidade - Zymos</title>
    <!-- Estilos globais e componentes -->
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../../../css/dashboard/dashboard.css" />
    <link
      rel="stylesheet"
      href="../../../css/dashboard/visao-geral/desvio-unidade.css"
    />

    <!-- Ícones Font Awesome -->
    <script
      src="https://kit.fontawesome.com/79924d81b1.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body
    style="
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    "
  >
    <!-- Card: Desvios por Unidades -->
    <article class="card-desvios-unidade" id="card-desvios-unidade">
      <div class="desvio-unidade-conteudo">
        <header class="desvio-unidade-header">
          <h3 class="desvio-unidade-titulo">Desvios por unidades</h3>
          <p class="desvio-unidade-subtitulo" id="desvio-unidade-subtitulo">
            Todas as unidades
          </p>
        </header>

        <div class="desvios-lista-unidades" id="lista-desvios-unidades">
          <!-- Matriz Ribeirão Preto -->
          <div class="desvio-unidade-item">
            <span class="desvio-unidade-nome">Matriz Ribeirão Preto</span>
            <div class="desvio-unidade-linha-progresso">
              <div class="desvio-unidade-barra-container">
                <div
                  class="desvio-unidade-barra-preenchimento"
                  style="width: 100%"
                ></div>
              </div>
              <span class="desvio-unidade-contagem">2</span>
            </div>
          </div>

          <!-- Campinas -->
          <div class="desvio-unidade-item">
            <span class="desvio-unidade-nome">Campinas</span>
            <div class="desvio-unidade-linha-progresso">
              <div class="desvio-unidade-barra-container">
                <div
                  class="desvio-unidade-barra-preenchimento"
                  style="width: 48%"
                ></div>
              </div>
              <span class="desvio-unidade-contagem">1</span>
            </div>
          </div>

          <!-- São Francisco -->
          <div class="desvio-unidade-item">
            <span class="desvio-unidade-nome">São Francisco</span>
            <div class="desvio-unidade-linha-progresso">
              <div class="desvio-unidade-barra-container">
                <span class="desvio-unidade-texto-vazio">0 desvios</span>
              </div>
              <span class="desvio-unidade-contagem"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Rodapé: Tempo Médio de Resposta -->
      <footer class="desvio-unidade-rodape">
        <span class="desvio-unidade-rodape-label">Tempo médio de resposta</span>
        <span
          class="desvio-unidade-rodape-valor"
          id="valor-tempo-resposta-unidade"
          >18 min</span
        >
      </footer>
    </article>
  </body>
</html>
