<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../css/dashboard/grafico-temperatura-real.css" />
  <link rel="stylesheet" href="../../css/global.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://kit.fontawesome.com/79924d81b1.js" crossorigin="anonymous"></script>
  <script src="../../js/dashboard/grafico-temperatura-real.js" defer></script>
  <title>Zymos - Dashboard</title>
</head>

<body>
  <div class="container-grafico">
    <div class="temp-real-container-header">
      <div class="temp-real-container-row">
        <h1 class="temp-real-titulo">
          Temperatura real × Faixa ideal — Lote 101-A (IPA)
        </h1>
        <div class="temp-real-badge-aovivo"> <span class="temp-real-badge-aovivo-circulo"></span>Ao vivo</div>
      </div>

      <div class="temp-real-legenda">
        <span class="temp-real-legenda-item">
          <span class="temp-real-legenda-linha"></span>Temperatura real
        </span>

        <span class="temp-real-legenda-item">
          <span class="temp-real-legenda-faixa"></span>Faixa ideal 15–24°C
        </span>
      </div>

      <p class="temp-real-descricao">
        Leitura a cada 2 segundos · janela dos últimos 20 segundos (tanque
        TQ-01)
      </p>
    </div>

    <div class="temp-real-grafico-wrapper">
      <canvas id="temperaturaRealGrafico"></canvas>
    </div>
  </div>
</body>

</html>
