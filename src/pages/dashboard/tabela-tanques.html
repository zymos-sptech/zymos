<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/branding/favicon.png"
    />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard/tabela-tanques.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <script src="../../js/dashboard/tabela-tanques.js" defer></script>
    <title>Zymos - Tanques e Lotes da Unidade</title>
  </head>
  <body>
    <section class="card-lotes" aria-labelledby="card-title">
        <header class="card-header">
          <h2 id="card-title" class="card-title">Tanques e lotes da unidade</h2>
        </header>

        <nav class="filtros-wrapper" aria-label="Filtro de lotes e tanques">
          <button
            type="button"
            class="filtro-btn active"
            data-filter="todos"
            onclick="filtrarTodos()"
          >
            Todos &middot; <span class="badge-count" id="count-todos"></span>
          </button>
          <button
            type="button"
            class="filtro-btn filtro-desvio"
            data-filter="desvio"
            onclick="filtrarDesvio()"
          >
            Em desvio &middot;
            <span class="badge-count" id="count-desvio"></span>
          </button>
          <button
            type="button"
            class="filtro-btn filtro-faixa"
            data-filter="faixa"
            onclick="filtrarFaixa()"
          >
            Na faixa &middot;
            <span class="badge-count" id="count-faixa"></span>
          </button>
          <button
            type="button"
            class="filtro-btn filtro-disponiveis"
            data-filter="disponiveis"
            onclick="filtrarDisponiveis()"
          >
            Dispon&iacute;veis &middot;
            <span class="badge-count" id="count-disponiveis"></span>
          </button>
        </nav>

        <div class="tabela-container">
          <table class="tabela-lotes">
            <thead>
              <tr>
                <th scope="col" class="th-tanque">Tanque</th>
                <th scope="col" class="th-lote">Lote</th>
                <th scope="col" class="th-temp">Temperatura atual</th>
                <th scope="col" class="th-faixa">Faixa ideal</th>
                <th scope="col" class="th-status">Status</th>
                <th scope="col" class="th-acao" aria-label="Ações"></th>
              </tr>
            </thead>
            <tbody id="tabela-lotes-body"></tbody>
          </table>
        </div>
      </section>
  </body>
</html>
