<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-con" href="./assets/logo-icon.png" />
    <link rel="stylesheet" href="./src/css/global.css" />
    <link
      rel="stylesheet"
      href="./src/css/pages/inicio/section-simulador.css"
    />
    <script
      src="https://kit.fontawesome.com/79924d81b1.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./src/js/injection.js"></script>
    <title>Início</title>
  </head>
  <body>
    <div id="header"></div>
    <section class="section-simulador">
      <div class="simulador-container-section">
        <div class="simulador-conteudo">
          <span class="simulador-badge"
            >CALCULADORA DE RETORNO SOBRE INVESTIMENTO</span
          >
          <h1 class="simulador-titulo">Quanto sua cervejaria tem a ganhar?</h1>
          <p class="simulador-descricao">
            Descubra em 2 minutos a economia da sua cervejaria ao evitar lotes
            fora do padrão e paradas de fermentação.
          </p>
          <button class="simulador-button">
            Ir para o simulador
            <i
              class="fa-solid fa-arrow-right"
              style="color: var(--color-neutral-gray)"
            ></i>
          </button>
        </div>

        <img class="simulador-img"  src="./assets/images/homem-cerveja.svg">
      </div>
    </section>
  </body>
</html>
