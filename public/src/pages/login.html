<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-con"
      href="../../assets/branding/favicon.png"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages/login/style.css" />
    <title>Zymos - login</title>
    <script src="../js/validations/validacoes.js" defer></script>
    <script src="../js/pages/login.js" defer></script>
    <script
      src="https://kit.fontawesome.com/79924d81b1.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="login-body">
    <section class="login-card">
      <div class="login-header">
        <a href="../../index.html">
          <img
            class="login-logo"
            src="../../assets/branding/logo-azul.png"
            alt="Zymos Qualidade na fermentação"
          />
        </a>

        <h1 class="login-title">Acesse sua conta</h1>
        <p class="login-description">
          Monitoramento térmico contínuo para sua cervejaria
        </p>
      </div>
      <form action="">
        <div class="login-container-input">
          <label for="iptEmail" class="login-label">E-mail corporativo</label>
          <div class="login-input-wrapper">
            <input
              type="email"
              name="email"
              id="iptEmail"
              placeholder="seuemail@cervejaria.com.br"
              class="login-input with-icon-left"
              aria-describedby="erroEmail"
            />
            <i class="fa-regular fa-envelope login-icon-input-left"></i>
          </div>
          <p class="login-erro" id="erroEmail" aria-live="polite"></p>
        </div>

        <div class="login-container-input">
          <label for="iptEmail" class="login-label">Senha</label>
          <div class="login-input-wrapper">
            <input
              type="password"
              name="password"
              id="iptPassword"
              placeholder="••••••••••••"
              class="login-input with-icon-left with-icon-right"
              aria-describedby="erroSenha"
            />
            <i class="fa-solid fa-lock login-icon-input-left"></i>

            <i
              onclick="passwordVisible()"
              id="iconPasswordInvisible"
              class="fa-regular fa-eye login-icon-input-right"
            ></i>
            <i
              onclick="passwordInvisible()"
              id="iconPasswordVisible"
              class="fa-regular fa-eye-slash login-icon-input-right password-visible"
            ></i>
          </div>
          <p class="login-erro" id="erroSenha" aria-live="polite"></p>
        </div>
        <button type="button" class="btn-login" onclick="handleFormLogin()">
          Entrar
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
      <div class="login-container-or">
        <div class="login-line"></div>
        <span class="login-description">ou</span>
        <div class="login-line"></div>
      </div>

      <p class="login-primeiro-acesso">
        Primeiro acesso? <a href="cadastro.html">Ativar minha conta</a>
      </p>
    </section>
  </body>
</html>
