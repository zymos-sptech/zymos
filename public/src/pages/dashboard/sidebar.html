<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/components/sidebar.css" />

    <script src="../../js/dashboard/sidebar.js" defer></script>
    <script
      src="https://kit.fontawesome.com/79924d81b1.js"
      crossorigin="anonymous"
    ></script>
    <title>Sidebar</title>
  </head>
  <body>
    <aside id="sidebar-open" class="sidebar-container">
      <button type="button" onclick="closeSidebar()" class="sidebar-btn-toggle">
        <i class="fa-solid fa-table-columns"></i>
      </button>
      <img
        class="sidebar-logo-open"
        src="../../../assets/branding/logo-branca.svg"
        alt="Zymos Qualidade na fermentação"
        draggable="false"
      />

      <hr class="sidebar-divider" />
      <nav>
        <ul class="sidebar-list">
          <li class="sidebar-link sidebar-link-active">
            <i class="fa-regular fa-house"></i>
            Visão geral
          </li>
          <li class="sidebar-link">
            <i class="fa-solid fa-chart-column"></i>
            Dashboard
          </li>
          <li class="sidebar-link">
            <i class="fa-regular fa-building"></i>
            Unidades
          </li>
          <li class="sidebar-link">
            <i class="fa-solid fa-jar"></i>
            Tanques
          </li>
          <li class="sidebar-link">
            <i class="fa-solid fa-flask"></i>
            Lotes
          </li>
          <li class="sidebar-link">
            <i class="fa-regular fa-user"></i>
            Perfil e configuração
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <hr class="sidebar-divider" />
        <div class="sidebar-user">
          <div class="sidebar-user-avatar">CS</div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name">Carlos Silva</span>
            <span class="sidebar-user-role">Administrador</span>
          </div>
        </div>
      </div>
    </aside>

    <aside id="sidebar-close" class="sidebar-container-close">
      <button
        type="button"
        onclick="openSidebar()"
        class="sidebar-btn-toggle btn-close"
      >
        <i class="fa-solid fa-table-columns"></i>
      </button>
      <img
        class="sidebar-logo-open"
        src="../../../assets/branding/mini-logo-branca.png"
        alt="Zymos Qualidade na fermentação"
        draggable="false"
      />

      <nav>
        <ul class="sidebar-list">
          <li class="sidebar-link sidebar-link-active">
            <i class="fa-regular fa-house"></i>
          </li>
          <li class="sidebar-link">
            <i class="fa-solid fa-chart-column"></i>
          </li>
          <li class="sidebar-link">
            <i class="fa-regular fa-building"></i>
          </li>
          <li class="sidebar-link">
            <i class="fa-solid fa-jar"></i>
          </li>
          <li class="sidebar-link">
            <i class="fa-solid fa-flask"></i>
          </li>
          <li class="sidebar-link">
            <i class="fa-regular fa-user"></i>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <hr class="sidebar-divider" />
        <div class="sidebar-user">
          <div class="sidebar-user-avatar">CS</div>
        </div>
      </div>
    </aside>
  </body>
</html>
